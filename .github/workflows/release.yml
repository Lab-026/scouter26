# Release automation: every time a version tag (v1.2.3) is pushed, this
# builds prebuilt binaries for two CPU architectures, packages them for
# Debian (.deb) and Fedora-style (.rpm) systems, and attaches everything
# to a GitHub Release — so users never need Rust installed to install us.
#
# Can also be run manually (Actions tab → Release → Run workflow) to test
# the pipeline without cutting a real release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary + docs into a tarball
        run: |
          cp README.md LICENSE target/${{ matrix.target }}/release/
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/scouter26-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            scouter26 LICENSE README.md
          # Versionless alias so "latest/download" URLs keep working
          cp "$GITHUB_WORKSPACE/scouter26-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            "$GITHUB_WORKSPACE/scouter26-${{ matrix.target }}.tar.gz"

      # --- Distro packages: x86_64 only (the distros' mainstream arch) ---
      - name: Build Debian package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          cargo deb
          cp target/debian/scouter26_*.deb \
            "$GITHUB_WORKSPACE/scouter26-amd64.deb"

      - name: Build RPM package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm
          cp target/generate-rpm/scouter26-*.rpm \
            "$GITHUB_WORKSPACE/scouter26-x86_64.rpm"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            scouter26-*.tar.gz
            scouter26-amd64.deb
            scouter26-x86_64.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect all packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      # Checksums let anyone verify their download landed intact — a
      # habit that scales into signing as the project matures.
      - name: Generate SHA256 checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      # Only a real version tag gets a Release; manual runs stop here,
      # having proven the pipeline by producing downloadable artifacts.
      - name: Attach everything to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
