# Continuous Integration: run the test suite on every push and pull request.
# GitHub spins up a fresh Linux VM for free (public repos), copies your code
# onto it, and proves the tests pass on a clean machine — not just yours.
name: CI

# When to run:
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest   # a clean Ubuntu machine, fresh every run
    steps:
      # Step 1: copy the repository code onto that machine
      - uses: actions/checkout@v4

      # Step 2: install a stable Rust toolchain
      - uses: dtolnay/rust-toolchain@stable

      # Step 3: save compiled dependencies after this run, so future runs
      # take ~1 minute instead of ~5 (it's a cache, like Cargo's but remote)
      - uses: Swatinem/rust-cache@v2

      # Step 4: the actual test — all tests must pass or the run goes red
      - run: cargo test --verbose

      # Step 5: quality gates. Tests check the code against its known
      # scenarios (they cannot prove every edge case); these check that
      # the code is also clean and consistent, so quality never rots.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  # Experimental: how healthy is macOS support really? Failures here are
  # reported but do not turn the badge red (continue-on-error), so this
  # job teaches without gating.
  macos-experiment:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - run: cargo test
