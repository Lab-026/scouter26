[package]
name = "scouter26"
version = "0.5.0"
edition = "2024"
description = "A modular network toolbox: subnet math, port lookup, parallel TCP scan"
license = "MIT"
repository = "https://github.com/Lab-026/scouter26"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ipnet = "2.9"
colored = "2.1"

# Makes the release binary smaller and faster:
#   lto           = optimize across the whole program, not file by file
#   codegen-units = 1 = one compilation unit (slower build, better optimization)
#   strip         = remove debug symbols from the final binary
[profile.release]
lto = true
codegen-units = 1
strip = true